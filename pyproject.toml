[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "translation-pipeline"
version = "0.1.0"
description = "Multi-pass, multi-model translation pipeline (DeepL + Claude + GPT-5)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Grzegorz Gorkiewicz" }]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "deepl>=1.18.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
translate = "translation_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/translation_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["deepl.*", "reportlab.*", "docx.*", "pypdf.*", "fitz.*", "pymupdf.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
